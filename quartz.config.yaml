# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: rootbeer.sh
  pageTitleSuffix: " | rootbeer.sh"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: rootbeer.sh
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: false
    typography:
      title: JetBrains Mono
      header: JetBrains Mono
      body: JetBrains Mono
      code: JetBrains Mono
    colors:
      # "Paper TTY": a printout from a line printer.
      lightMode:
        light: "#f4f1e8"
        lightgray: "#dcd6c4"
        gray: "#7d7766"
        darkgray: "#2e2b24"
        dark: "#16140f"
        secondary: "#1d6b37"
        tertiary: "#14532d"
        highlight: rgba(29, 107, 55, 0.08)
        textHighlight: "#3fa66b44"
      # Green phosphor terminal: bright green links, dark green accents.
      darkMode:
        light: "#0b0d0b"
        lightgray: "#1e2520"
        gray: "#6b7a6e"
        darkgray: "#c5d1c2"
        dark: "#e6efe2"
        secondary: "#5ee38a"
        tertiary: "#3fa66b"
        highlight: rgba(94, 227, 138, 0.08)
        textHighlight: "#3fa66b55"
plugins:
  # Parses frontmatter. The properties panel is hidden; tags render via tag-list.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    options:
      # SmartyPants turns "--" into dashes; the site uses no em or en dashes.
      enableSmartyPants: false
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  # Self-hosts the theme fonts (theme.cdnCaching: false), so visitors make no
  # requests to Google.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: ls ~
      folderDefaultState: open
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
      condition: not-index
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: not-index
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # Replaced by the PromptBreadcrumb shell component (see quartz.ts).
  - source: "@quartz-community/breadcrumbs"
    enabled: false
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/vR00TB33R
        LinkedIn: https://www.linkedin.com/in/spencerbeer/
        Email: mailto:spencer@rootbeer.sh
        RSS: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
